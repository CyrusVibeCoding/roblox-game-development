<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chicken Farm HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="landing">
    <nav class="nav">
      <div class="brand"><span class="logo">🐔</span> Chicken Farm HQ</div>
      <div class="nav-links">
        <a href="#">The Game</a>
        <a href="#">The Team</a>
        <a href="#">Roadmap</a>
        <a href="#">Devlog</a>
      </div>
      <a class="pill" href="login.html">Team Login</a>
    </nav>

    <section class="hero">
      <div class="float a">🥚</div>
      <div class="float b">🐔</div>
      <div class="float c">🌾</div>

      <div class="tag">Game Stats</div>
      <h1>Growing Our Farm, One Update At A Time</h1>
      <div class="big-num" id="visits">0</div>
      <div class="big-label">Game Visits</div>
      <div class="cta"><a class="btn-dark" href="login.html">Open Dashboard →</a></div>
    </section>
    <div class="curve"></div>
  </div>

  <script src="config.js"></script>
  <script src="roblox-stats.js"></script>
  <script>
    (function () {
      var el = document.getElementById("visits");
      function animate(target) {
        var start = null;
        function tick(ts) {
          if (start === null) start = ts;
          var p = Math.min((ts - start) / 900, 1);
          el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString();
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      window.getGameVisits().then(animate);
    })();
  </script>
</body>
</html>
